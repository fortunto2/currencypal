name: CurrencyPal
options:
  bundleIdPrefix: com.currencypal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES

targets:
  CurrencyPal:
    type: application
    platform: iOS
    sources:
      - CurrencyPal
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.currencypal.app
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 8N495BBBLM
        CODE_SIGN_STYLE: Automatic

  CurrencyPalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CurrencyPalTests
    dependencies:
      - target: CurrencyPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currencypal.tests
