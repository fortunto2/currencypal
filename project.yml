name: CurrencyPal
options:
  bundleIdPrefix: co.superduperai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "3"

packages:
  SuperDuperAnalytics:
    # Локальный путь, а не git: пакет живёт в этом же дереве, и версия, которая собирается,
    # обязана быть той, которую сейчас правят. Появится публичный репозиторий — станет url.
    path: ../../shared/superduperai-analytics

targets:
  CurrencyPal:
    type: application
    platform: iOS
    sources:
      - CurrencyPal
    dependencies:
      - package: SuperDuperAnalytics
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CurrencyPals
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Only HTTPS calls to public rate APIs — no custom or proprietary crypto
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.currencypal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 8N495BBBLM
        CODE_SIGN_STYLE: Automatic

  CurrencyPalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CurrencyPalTests
    dependencies:
      - target: CurrencyPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.currencypal.tests
        GENERATE_INFOPLIST_FILE: YES

  CurrencyPalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CurrencyPalUITests
    dependencies:
      - target: CurrencyPal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.currencypal.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CurrencyPal
